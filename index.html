<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-rows:1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr ;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            width:100%;
            height: 80%;
           
            text-align: center;
        }
        .box{
            width:100%;
            height: 80px;
            background-color: blue;
        }
        .box1{
background-color: aqua;
        }
        .box2{
            grid-column: span 3;
            background-color:blue;
        }
        .box3{
            grid-column: span 4;
            grid-row: span 4;
            height: 320px;
            background-color: violet;
        }
        .box4{
            grid-column: span 2;
            grid-row: span 2;
            height: 160px;
            background-color: greenyellow;
        }
        .box5{
            grid-row:span 2;
            height: 160px;
            background-color: brown;
        }
        .box8{
            grid-column: span 4;
           grid-row:span 2;
           height: 160px;
           background-color: cadetblue;
           
        }
        .box6{
            background-color: chocolate;
        }
        .box7{
          background-color: chartreuse;
        }

        
        .box1{ grid-area: header; }
        .box2{ grid-area: menu; }
        .box3{ grid-area: hero; }
        .box4{ grid-area: main; }
        .box5{ grid-area: gap; }
        .box6{ grid-area: image; }
        .box7{ grid-area: extra; }
        .box8{ grid-area: banner; }

        /* Purani fixed heights hata do, grid khud size dega */
        .container{ height: auto; }
        .box{ height: auto; }

        /* ---------- MOBILE (default) ---------- */
        .container{
            grid-template-columns: 1fr;
            grid-template-rows: 60px 60px 160px 160px 120px 120px 120px;
            grid-template-areas:
                "header"
                "menu"
                "hero"
                "main"
                "banner"
                "extra"
                "image";
        }
        .box5{ display: none; }   /* khali jagah mobile/tablet par nahi chahiye */

        /* ---------- TABLET ---------- */
        @media (min-width: 600px){
            .container{
                grid-template-columns: 1fr 2fr 1fr;
                grid-template-rows: 60px 240px 240px 120px 120px;
                grid-template-areas:
                    "header header header"
                    "hero   hero   hero"
                    "menu   main   main"
                    "menu   banner banner"
                    "menu   extra  image";
            }
        }

        /* ---------- DESKTOP ---------- */
        @media (min-width: 992px){
            .container{
                grid-template-columns: repeat(4, 1fr);
                grid-template-rows: 60px 360px 120px 120px 120px;
                grid-template-areas:
                    "header menu   menu  menu"
                    "hero   hero   hero  hero"
                    "main   main   gap   image"
                    "main   main   gap   extra"
                    "banner banner banner banner";
            }
            .box5{
                display: block;
                background-color: white;  /* image ki tarah white khali jagah */
            }
        }
    </style>
</head>
<body>
    <div class="container">        
    <div class="box box1">HEADER</div>
    <div class="box box2" >MENU</div>
    <div class="box box3">HERO</div>
    <div class="box box4">MAIN</div>
    <div class="box box5">GAP</div>
    <div class="box box6">IMAGE</div>
    <div class="box box7">EXTRA</div>
    <div class="box box8">BANNER</div>
    
</div>
    
</body>
</html>
